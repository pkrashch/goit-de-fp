services:
  # Частина 1: MySQL з даними athlete_bio і athlete_event_results
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olympic_dataset
      MYSQL_USER: fp_user
      MYSQL_PASSWORD: fp_password
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      retries: 30

  # Частина 2: Airflow зі Spark, DAG і Spark-джоби з папки part2
  airflow:
    build:
      context: ./docker
      dockerfile: Dockerfile.airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://local%5B%2A%5D"
    volumes:
      - ./part2:/opt/airflow/dags
      - ./datalake:/opt/airflow/datalake
    working_dir: /opt/airflow/datalake
    ports:
      - "8080:8080"

volumes:
  mysql_data:
